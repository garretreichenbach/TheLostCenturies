# Companion mod release, run by hand: Actions → "Companion mod release" → Run workflow → version (e.g. 0.2.0).
#   1. builds mod/ with that version
#   2. creates tag mod-v<version> + a GitHub release with lostcenturies-<version>.jar
#   3. (optional) points pack/mods/lostcenturies.pw.toml at that jar, runs packwiz refresh, pushes to main
# The Pelican server picks it up on its next restart.
name: Companion mod release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version (e.g. 0.2.0), becomes tag mod-v<version>'
        required: true
        type: string
      update_pack:
        description: 'Point the pack at this release (commit to main)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: writes-to-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: mod-v${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' must look like 1.2.3"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a new version."; exit 1
          fi
          echo "JAR=mod/build/libs/lostcenturies-$VERSION.jar" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        working-directory: mod
        # skipRecompile: no Minecraft decompile needed to build the jar (faster, less RAM)
        run: ./gradlew build -PskipRecompile -Pmod_version="$VERSION"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Companion mod $VERSION" \
            --generate-notes

      - name: Setup Go (for packwiz)
        if: inputs.update_pack
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Point the pack at the release
        if: inputs.update_pack
        run: |
          go install github.com/packwiz/packwiz@latest
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/lostcenturies-${VERSION}.jar"

          # side = "server": only the server needs it. Dev clients get dev builds via `./gradlew installToPrism`,
          # and a client-side copy here would clash with them (duplicate mod).
          cat > pack/mods/lostcenturies.pw.toml <<TOML
          name = "The Lost Centuries Core"
          filename = "lostcenturies-${VERSION}.jar"
          side = "server"

          [download]
          url = "${URL}"
          hash-format = "sha256"
          hash = "${SHA}"
          TOML

          (cd pack && "$(go env GOPATH)/bin/packwiz" refresh)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack
          git commit -m "pack: companion mod ${VERSION}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
