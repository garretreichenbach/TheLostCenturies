plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content { includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    enable {
        version = project.neo_version
        // `./gradlew build -PskipRecompile` skips decompiling Minecraft: faster and needs much less RAM,
        // but the IDE won't have Minecraft sources. Useful for CI / low-memory machines.
        disableRecompilation = project.hasProperty('skipRecompile')
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // MineColonies (+ the ldtteam libraries its API types reference)
    compileOnly "curse.maven:minecolonies-245506:${minecolonies_file}"
    compileOnly "curse.maven:structurize-298744:${structurize_file}"
    compileOnly "curse.maven:blockui-522992:${blockui_file}"
    localRuntime "curse.maven:minecolonies-245506:${minecolonies_file}"
    localRuntime "curse.maven:structurize-298744:${structurize_file}"
    localRuntime "curse.maven:blockui-522992:${blockui_file}"
    localRuntime "curse.maven:domum-ornamentum-527361:${domum_file}"
    localRuntime "curse.maven:multi-piston-303278:${multipiston_file}"
    localRuntime "curse.maven:towntalk-900364:${towntalk_file}"

    // FTB Teams (+ Architectury for its events)
    compileOnly "curse.maven:ftb-teams-forge-404468:${ftbteams_file}"
    compileOnly "curse.maven:architectury-api-419699:${architectury_file}"
    localRuntime "curse.maven:ftb-teams-forge-404468:${ftbteams_file}"
    localRuntime "curse.maven:ftb-library-forge-404465:${ftblibrary_file}"
    localRuntime "curse.maven:architectury-api-419699:${architectury_file}"

    // Thirst Was Taken
    compileOnly "maven.modrinth:thirst-was-taken:${thirst_version}"
    localRuntime "maven.modrinth:thirst-was-taken:${thirst_version}"

    // Create
    compileOnly "maven.modrinth:create:${create_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}" // bundled in Create's jar; needed for its API types
    localRuntime "maven.modrinth:create:${create_version}"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------
// Prism Launcher integration
//   ./gradlew installToPrism   build the jar and copy it into the Prism instance's mods/ folder
//   ./gradlew runPrism         installToPrism, then launch the instance through Prism
// Configure in gradle.properties, ~/.gradle/gradle.properties or with -P:
//   prism_instance       Prism instance ID (= its folder name under instances/)
//   prism_instances_dir  Prism's instances/ folder ("~" is expanded)
//   prism_executable     optional: path to the Prism binary (otherwise common locations are tried)
// ---------------------------------------------------------------------------

abstract class InstallToPrism extends DefaultTask {
    @InputFile abstract RegularFileProperty getModJar()
    @Internal abstract Property<String> getInstanceDir()
    @Input abstract Property<String> getJarPrefix()

    @TaskAction
    void install() {
        File instance = new File(instanceDir.get())
        if (!instance.isDirectory()) {
            throw new GradleException("Prism instance not found: ${instance}\n" +
                    "Set prism_instance / prism_instances_dir (gradle.properties, ~/.gradle/gradle.properties or -P).")
        }
        // Newer Prism instances use minecraft/, older MultiMC-style ones .minecraft/
        File gameDir = new File(instance, 'minecraft')
        if (!gameDir.isDirectory() && new File(instance, '.minecraft').isDirectory()) {
            gameDir = new File(instance, '.minecraft')
        }
        File mods = new File(gameDir, 'mods')
        mods.mkdirs()

        // Remove previously installed builds of this mod (any version), leave everything else alone.
        mods.listFiles()?.findAll { it.isFile() && it.name.startsWith(jarPrefix.get()) && it.name.endsWith('.jar') }?.each {
            if (!it.delete()) throw new GradleException("Could not delete old build ${it} (is the game still running?)")
            logger.lifecycle("Removed old ${it.name}")
        }
        File src = modJar.get().asFile
        java.nio.file.Files.copy(src.toPath(), new File(mods, src.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Installed ${src.name} -> ${mods}")
    }
}

abstract class LaunchPrism extends DefaultTask {
    @Input abstract Property<String> getInstanceId()
    @Input abstract ListProperty<String> getExecutableCandidates()

    @TaskAction
    void launch() {
        File exe = executableCandidates.get().collect { new File(it) }.find { it.isFile() && it.canExecute() }
        if (exe == null) {
            throw new GradleException("Prism Launcher executable not found. Tried:\n  " +
                    executableCandidates.get().join('\n  ') + "\nSet prism_executable to its path.")
        }
        // Don't wait: if Prism is already open this hands the launch to the running window and exits;
        // otherwise it starts Prism, which keeps running after Gradle finishes.
        new ProcessBuilder(exe.absolutePath, '--launch', instanceId.get())
                .redirectErrorStream(true)
                .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                .start()
        logger.lifecycle("Launching Prism instance '${instanceId.get()}' via ${exe}")
    }
}

def userHome = System.getProperty('user.home')
def expandHome = { String p -> p.startsWith('~') ? userHome + p.substring(1) : p }
def prismInstance = providers.gradleProperty('prism_instance').orElse('1.21.1')
def prismInstancesDir = providers.gradleProperty('prism_instances_dir')
        .orElse('~/Library/Application Support/PrismLauncher/instances')
        .map(expandHome)

tasks.register('installToPrism', InstallToPrism) {
    group = 'prism'
    description = 'Builds the mod jar and copies it into the Prism instance mods/ folder.'
    modJar = tasks.named('jar').flatMap { it.archiveFile }
    instanceDir = prismInstancesDir.zip(prismInstance) { dir, id -> "${dir}/${id}".toString() }
    jarPrefix = "${mod_id}-".toString()
    outputs.upToDateWhen { false }
}

tasks.register('runPrism', LaunchPrism) {
    group = 'prism'
    description = 'Installs the mod into the Prism instance and launches it.'
    dependsOn 'installToPrism'
    instanceId = prismInstance
    executableCandidates = providers.gradleProperty('prism_executable').map { [expandHome(it)] }.orElse([
            '/Applications/Prism Launcher.app/Contents/MacOS/prismlauncher',
            '/Applications/PrismLauncher.app/Contents/MacOS/prismlauncher',
            "${userHome}/Applications/Prism Launcher.app/Contents/MacOS/prismlauncher".toString(),
            "${userHome}/Applications/PrismLauncher.app/Contents/MacOS/prismlauncher".toString(),
            '/usr/bin/prismlauncher',
            '/usr/local/bin/prismlauncher',
            'C:/Program Files/PrismLauncher/prismlauncher.exe',
            "${userHome}/AppData/Local/Programs/PrismLauncher/prismlauncher.exe".toString(),
    ])
}
